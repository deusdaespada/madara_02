[build]
  command = "npm run build"
  publish = ".next"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[build.environment]
  NEXT_TELEMETRY_DISABLED = "1"
  NODE_VERSION = "20"

# Long-cache immutable static assets
[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Manga cover/page images proxied through Supabase Storage
[[headers]]
  for = "/storage/*"
  [headers.values]
    Cache-Control = "public, max-age=86400, stale-while-revalidate=604800"

[[redirects]]
  from = "/obra/:slug"
  to = "/manga/:slug"
  status = 301

[[redirects]]
  from = "/leitor/:slug/:chapter"
  to = "/manga/:slug/read/:chapter"
  status = 301

# SPA-safe fallback for the admin panel's client-side routes, if any remain client-rendered
[[redirects]]
  from = "/admin/*"
  to = "/admin/:splat"
  status = 200
